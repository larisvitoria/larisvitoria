<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>
    <style>
      .name { fill: #2b2b2b; }
      .subtitle { fill: #555555; }
      .contour { stroke: #FFD1DC; }
      @media (prefers-color-scheme: dark) {
        .name { fill: #f5f5f5; }
        .subtitle { fill: #d9d9d9; }
        .contour { stroke: #FF8FB3; }
      }
    </style>
  </defs>

  <!-- linhas de contorno (motivo topográfico / geoespacial) -->
  <g class="contour" fill="none" stroke-width="1.4">
    <ellipse cx="760" cy="120" rx="60" ry="40" opacity="0.9"/>
    <ellipse cx="760" cy="120" rx="95" ry="65" opacity="0.75"/>
    <ellipse cx="750" cy="118" rx="135" ry="92" opacity="0.6"/>
    <ellipse cx="745" cy="115" rx="175" ry="118" opacity="0.45"/>
    <ellipse cx="740" cy="112" rx="215" ry="144" opacity="0.3"/>
    <ellipse cx="735" cy="110" rx="255" ry="170" opacity="0.18"/>
  </g>

  <!-- pin de localização -->
  <g transform="translate(760,105)">
    <path d="M0,-26 C14,-26 25,-15 25,-2 C25,16 0,38 0,38 C0,38 -25,16 -25,-2 C-25,-15 -14,-26 0,-26 Z" fill="#FF1493"/>
    <circle cx="0" cy="-2" r="9" fill="#FFF5F8"/>
  </g>

  <!-- nome -->
  <text class="name" x="60" y="112" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">
    Larissa Vitória
  </text>

  <!-- linha fina em degradê -->
  <rect x="62" y="132" width="470" height="4" fill="url(#ruleGrad)"/>

  <!-- subtítulo -->
  <text class="subtitle" x="60" y="168" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="0.5">
    Analista de Dados Geoespaciais  ·  Desenvolvedora Back-End
  </text>
</svg>
